[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kisukisu"
version = "1.0.0"
authors = [
  { name = "Kishore M", email = "kishoredxd@gmail.com" },
]
description = "A lightweight, customizable, privacy-first desktop presenter companion. Read scripts, manage notes, and stay in control while presenting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Desktop Environment",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "customtkinter>=5.2.2",
    "darkdetect>=0.8.0",
    "Pillow>=10.0.0",
    "pystray>=0.19.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]

[project.scripts]
kisukisu = "kisukisu.app:main"

[project.urls]
"Homepage" = "https://github.com/MKishoreDev/kisukisu"
"Bug Tracker" = "https://github.com/MKishoreDev/kisukisu/issues"
"Releases" = "https://github.com/MKishoreDev/kisukisu/releases"

[tool.setuptools.packages.find]
include = ["kisukisu*"]

[tool.setuptools.package-data]
"kisukisu" = ["assets/*"]
